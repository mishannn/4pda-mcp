name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Trusted Publishing via OIDC: no API tokens stored in the repo.
# Configure a GitHub publisher on https://pypi.org/manage/account/publishing/
#   - PyPI project name: 4pda-mcp
#   - Owner: mishannn
#   - Repository: 4pda-mcp
#   - Workflow filename: .github/workflows/publish.yml
#   - Environment name: pypi

permissions:
  id-token: write  # required for Trusted Publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags, needed by hatch-vcs for versioning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDIST_VERSION=$(ls dist/*.tar.gz | sed -n 's/.*4pda_mcp-\(.*\)\.tar\.gz/\1/p')
          echo "tag=$TAG sdist=$SDIST_VERSION"
          test "$TAG" = "$SDIST_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # must match the environment name set on PyPI's publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1